# Bloco do nginx para retro.dalmasstudio.com.br (app estático, saída do `npm run build`).
# Ajustar o `root` se o nginx rodar em Docker: a pasta da VPS precisa estar montada no container
# (ex.: /home/dalmas/apps/dalmasstudio/retro -> /usr/share/nginx/retro).
# SSL: depois do DNS propagar, `certbot --nginx -d retro.dalmasstudio.com.br` completa o bloco 443.

server {
    listen 80;
    server_name retro.dalmasstudio.com.br;

    root /home/dalmas/apps/dalmasstudio/retro;
    index index.html;

    # Arquivos com hash no nome: cache longo.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html sem cache, pra versão nova aparecer logo após o deploy.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
}
